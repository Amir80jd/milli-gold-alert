name: Test Milli Gold

on:
  workflow_dispatch:

jobs:
  test-milli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Get Milli price
        run: |
          python milli_monitor.py > price.txt
          cat price.txt

      - name: Send Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          PRICE=$(grep "Price:" price.txt | sed 's/Price: //')
          MESSAGE="🟡 تست ربات میلی - قیمت فعلی: ${PRICE} تومان"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
